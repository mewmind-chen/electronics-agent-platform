# Official JSON-RPC composition for Phase 1.
# Base: deepseek-ai/deepseek-harness examples/jsonrpc-agent/minimal.cordis.yml
# plus the electronics-hello plugin. stdout is the JSON-RPC protocol.
# Do not add a stdout logger. Do not add Workbench MCP.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-chat'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are the electronics-agent-platform Phase 1 probe. When asked to ping, call hello_ping and return its JSON only.'
    workspaceContext: false
    skills:
      enabled: true
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.dsh-platform/sessions'
    compression: none

# Absolute path is rewritten by scripts/write-overlays.mjs when needed.
# Bare package name resolves from this configuration project's node_modules.
- id: electronics-hello
  name: '@electronics/dsh-hello'

- id: electronics-import
  name: '@electronics/dsh-import'

- id: electronics-part
  name: '@electronics/dsh-part'

- id: electronics-company
  name: '@electronics/dsh-company'
