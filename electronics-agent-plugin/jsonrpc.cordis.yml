# User-side JSON-RPC composition for Electronics Agent Plugin verification.
# Not the Platform Runtime. Tools HTTP-call Agent API. No dsh-import/part/company.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-chat'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: deepseek-v4-flash
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: deepseek-v4-pro
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are the Electronics Agent. Load skill part-analysis, import-analysis, or company-analysis. Call part_research, import_extract, or company_research. Never write a business database. Reply with the business report. Never paste the full tool JSON.'
    workspaceContext: false
    skills:
      enabled: true
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.dsh-plugin-sessions'
    compression: none

- id: electronics-agent
  name: './src/index.js'
