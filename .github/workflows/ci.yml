name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This repository intentionally has no committed root lockfile yet.
          # Do not enable setup-node's npm cache until a reviewed lockfile lands.
      - run: npm install --ignore-scripts
      - run: npm test
