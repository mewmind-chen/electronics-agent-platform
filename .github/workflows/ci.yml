name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This repository intentionally has no committed root lockfile yet.
          # Do not enable setup-node's npm cache until a reviewed lockfile lands.
      - run: npm install --ignore-scripts
      # Phase 1 deliberately proves the official CLI composition. Developer
      # machines may have `dsh` globally; a clean runner must install the same
      # pinned CLI explicitly before executing that invariant.
      - name: Install pinned official Harness CLI in isolation
        run: |
          # The published rc.6 meta-package has a very large cyclic peer graph;
          # npm's modern peer resolver can spend the whole job resolving it.
          # The official package itself is still pinned and fully installed.
          npm install --prefix "$RUNNER_TEMP/dsh-cli" --ignore-scripts --legacy-peer-deps @deepseek-ai/dsh@0.1.0-rc.6
          echo "$RUNNER_TEMP/dsh-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm test
