name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This repository intentionally has no committed root lockfile yet.
          # Do not enable setup-node's npm cache until a reviewed lockfile lands.
      - run: npm install --ignore-scripts
      # Phase 1 deliberately proves the official CLI composition. Developer
      # machines may have `dsh` globally; a clean runner must install the same
      # pinned CLI explicitly before executing that invariant.
      - name: Install pinned official Harness CLI in isolation
        run: |
          # The rc.6 meta-package has a large cyclic peer graph and its caret
          # dependencies currently resolve to rc.8 peers. Pin the CLI and the
          # headless composition peers explicitly; npm's peer resolver otherwise
          # either loops or omits modules required at boot.
          npm install --prefix "$RUNNER_TEMP/dsh-cli" --ignore-scripts --legacy-peer-deps --save-exact \
            @deepseek-ai/dsh@0.1.0-rc.6 \
            @deepseek-ai/cordis-plugin-group@1.0.1 \
            @deepseek-ai/dsh-invariants@0.1.0-rc.8 \
            @deepseek-ai/dsh-fs@0.1.0-rc.8 \
            @deepseek-ai/dsh-scope@0.1.0-rc.8 \
            @deepseek-ai/dsh-compaction@0.1.0-rc.8 \
            @deepseek-ai/dsh-output-retention@0.1.0-rc.8 \
            @deepseek-ai/dsh-timeout@0.1.0-rc.8 \
            @deepseek-ai/dsh-shell@0.1.0-rc.8 \
            @deepseek-ai/dsh-sandbox@0.1.0-rc.8 \
            @deepseek-ai/dsh-workflow@0.1.0-rc.8 \
            @deepseek-ai/dsh-spill@0.1.0-rc.8 \
            @deepseek-ai/dsh-code-runtime@0.1.0-rc.8
          echo "$RUNNER_TEMP/dsh-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm test
